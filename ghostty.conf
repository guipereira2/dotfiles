command = /usr/bin/zsh -l

quit-after-last-window-closed = false

font-family = JetBrainsMono Nerd Font
font-size = 13
font-feature = liga
font-feature = calt

window-padding-x = 15
window-padding-y = 15
window-padding-balance = true
background-opacity = 0.9
window-decoration = auto
gtk-titlebar = false

desktop-notifications = false

copy-on-select = true

cursor-color = #ffffff
cursor-text = #181818

background = #181818
foreground = #ffffff

palette = 0=#52494e
palette = 1=#c73c3f
palette = 2=#73c936
palette = 3=#ffdd33
palette = 4=#96a6c8
palette = 5=#9e95c7
palette = 6=#95a99f
palette = 7=#ffffff

palette = 8=#52494e
palette = 9=#c73c3f
palette = 10=#73c936
palette = 11=#ffdd33
palette = 12=#96a6c8
palette = 13=#9e95c7
palette = 14=#95a99f
palette = 15=#ffffff

keybind = ctrl+shift+c=copy_to_clipboard
keybind = ctrl+shift+v=paste_from_clipboard
keybind = shift+enter=text:\x1b\r
keybind = ctrl+tab=text:\x1b[9;5u
keybind = ctrl+shift+tab=text:\x1b[9;6u
keybind = ctrl+enter=unbind
